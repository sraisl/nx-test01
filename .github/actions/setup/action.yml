name: Setup
description: Install tools from mise.toml, restore Maven and Nx caches, install npm dependencies.

runs:
  using: composite
  steps:
    - name: Install tools (mise)
      uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6

    - name: Cache Maven repository
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.m2/repository
        key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml', '.mvn/wrapper/maven-wrapper.properties') }}
        restore-keys: |
          maven-${{ runner.os }}-

    - name: Cache Nx
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .nx/cache
        key: nx-${{ runner.os }}-${{ github.sha }}
        restore-keys: |
          nx-${{ runner.os }}-

    - name: Install npm dependencies
      shell: bash
      run: npm ci
